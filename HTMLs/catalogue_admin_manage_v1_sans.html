<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Works — Michele Oka Doner: A Catalogue Raisonné</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --white:  #ffffff;
    --sand:   #f0ede8;
    --ink:    #1c1c1c;
    --mid:    #5c5855;
    --light:  #999490;
    --rule:   #e2dfda;
    --rulelg: #eeecea;
    --gold:   #7a5c3a;
    --goldlt: #c9a87c;
    --hover:  #f7f5f2;
    --red:    #a83232;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--sand); color: var(--ink); font-family: 'Inter', sans-serif; font-weight: 400; }

  header {
    position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 1px solid var(--rule);
    height: 58px; display: flex; align-items: center; padding: 0 24px; gap: 24px;
  }
  .header-title { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .header-nav { margin-left: auto; display: flex; align-items: center; gap: 20px; }
  .header-nav a { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--light); text-decoration: none; }
  .header-nav a:hover { color: var(--ink); }
  .header-nav button {
    font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--light); background: none; border: none; cursor: pointer;
  }
  .header-nav button:hover { color: var(--ink); }

  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 96px; }
  .page-head h1 { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 24px; letter-spacing: -.01em; margin-bottom: 6px; }
  .page-head p { font-size: 12.5px; color: var(--mid); margin-bottom: 24px; }

  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-bar input, .filter-bar select {
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ink);
    border: 1px solid var(--rule); background: var(--white); padding: 9px 12px;
  }
  #searchName { flex: 1; min-width: 200px; }
  .result-count { font-size: 11.5px; color: var(--light); margin-bottom: 14px; }

  table { width: 100%; border-collapse: collapse; background: var(--white); border: 1px solid var(--rule); }
  thead th {
    text-align: left; font-size: 9px; letter-spacing: .1em; font-weight: 500; text-transform: uppercase;
    color: var(--light); padding: 10px 14px; border-bottom: 1px solid var(--rule); background: var(--sand);
  }
  tbody td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--rulelg); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.pending-delete { opacity: .45; }
  .row-thumb { width: 40px; height: 40px; object-fit: cover; background: var(--sand); display: block; }
  .row-title { font-weight: 500; }
  .row-actions { display: flex; gap: 10px; white-space: nowrap; }
  .row-actions a, .row-actions button {
    font-family: 'Inter', sans-serif; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--mid); text-decoration: none; background: none; border: none; cursor: pointer; padding: 0;
  }
  .row-actions a:hover { color: var(--ink); }
  .row-actions .del-link:hover { color: var(--red); }
  .row-actions .undo-link { color: var(--gold); }
  .empty-state { padding: 40px; text-align: center; color: var(--light); font-size: 13px; font-style: italic; }
</style>
</head>
<body>

<header>
  <div class="header-title">MOD CR — Admin</div>
  <div class="header-nav">
    <a href="catalogue_admin_v1_sans.html">Dashboard</a>
    <a href="catalogue_intake_v1_sans.html">Add a Work</a>
    <a href="catalogue_v10_sans.html">View Site</a>
    <button onclick="logOut()">Log Out</button>
  </div>
</header>

<main>
  <div class="page-head">
    <h1>Manage Works</h1>
    <p>Every catalogued work. Search or filter to find one, then edit or mark it for removal.</p>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchName" placeholder="Search by title or MOD CR number…">
    <select id="filterTag">
      <option value="">All Materials</option>
      <option value="ceramic">Ceramic</option>
      <option value="bronze">Bronze</option>
      <option value="jewelry">Jewelry</option>
      <option value="drawing">Works on Paper</option>
      <option value="installation">Installation</option>
    </select>
    <select id="filterDecade">
      <option value="">All Decades</option>
      <option value="1960">1960s</option>
      <option value="1970">1970s</option>
      <option value="1980">1980s</option>
      <option value="1990">1990s</option>
      <option value="2000">2000s</option>
      <option value="2010">2010s</option>
      <option value="2020">2020s</option>
    </select>
  </div>

  <div class="result-count" id="resultCount"></div>

  <table>
    <thead>
      <tr><th></th><th>Title</th><th>MOD CR</th><th>Date</th><th>Material</th><th></th></tr>
    </thead>
    <tbody id="worksTableBody"></tbody>
  </table>
</main>

<script>
if(localStorage.getItem('modcr_admin_authed') !== 'true'){
  window.location.href = 'catalogue_admin_login_v1_sans.html';
}
function logOut(){
  localStorage.removeItem('modcr_admin_authed');
  window.location.href = 'catalogue_admin_login_v1_sans.html';
}

const works = [
  {id:1,  cr:"MOD CR 1",  title:"Tattooed Torso",      date:"1966",    year:1966, medium:"Ceramic",                            tag:"ceramic",      series:"early-clay",           img:"../Entry Images/TattooedTorso1966-icon.png"},
  {id:13, cr:"MOD CR 13", title:"Ceramic Seeds",        date:"c. 1971", year:1971, medium:"Glazed ceramic",                     tag:"ceramic",      series:"early-clay",           img:"../Entry Images/TwoCeramicSeeds-icon-1.png"},
  {id:2,  cr:"MOD CR 2",  title:"Germinating Seeds",    date:"c. 1972", year:1972, medium:"Bronze",                             tag:"bronze",       series:"early-clay",           img:"../Entry Images/GerminatingSeeds-icon-223x200.png"},
  {id:18, cr:"MOD CR 18", title:"Tattooed Relic",       date:"c. 1974", year:1974, medium:"Ceramic",                            tag:"ceramic",      series:"early-clay",           img:"../Entry Images/Tatoed_Relic.jpg"},
  {id:14, cr:"MOD CR 14", title:"Death Masks",          date:"c. 1975", year:1975, medium:"Ceramic",                            tag:"ceramic",      series:"early-clay",           img:"../Entry Images/DeathMasks-Icon.png"},
  {id:15, cr:"MOD CR 15", title:"Descending Torsos",    date:"1975",    year:1975, medium:"Ceramic",                            tag:"ceramic",      series:"early-clay",           img:"../Entry Images/DescendingTorsos1975-icon.png"},
  {id:16, cr:"MOD CR 16", title:"Wings II",             date:"1975",    year:1975, medium:"Raku ceramic",                       tag:"ceramic",      series:"early-clay",           img:"../Entry Images/WaveFigures-Icon.png"},
  {id:20, cr:"MOD CR 20", title:"Seeds & Pods",         date:"c. 1975", year:1975, medium:"Ceramic",                            tag:"ceramic",      series:"early-clay",           img:"../Entry Images/SeadPods-icon.png"},
  {id:17, cr:"MOD CR 17", title:"Triads",               date:"c. 1976", year:1976, medium:"Raku ceramic",                       tag:"ceramic",      series:"early-clay",           img:"../Entry Images/Tortoises-icon.png"},
  {id:21, cr:"MOD CR 21", title:"Tattooed Dolls",       date:"c. 1975", year:1975, medium:"Ceramic",                            tag:"ceramic",      series:"early-clay",           img:"../Entry Images/Totems-icon.png"},
  {id:19, cr:"MOD CR 19", title:"Figures with Staffs",  date:"c. 1978", year:1978, medium:"Ceramic",                            tag:"ceramic",      series:"early-clay",           img:"../Entry Images/Figures-Icon.png"},
  {id:3,  cr:"MOD CR 3",  title:"Burning Branches",     date:"1975",    year:1975, medium:"Bronze",                             tag:"bronze",       series:"bronze-works",         img:"../Entry Images/BurningBranches-Icon.png"},
  {id:4,  cr:"MOD CR 4",  title:"Soul Catchers",        date:"1977",    year:1977, medium:"Bronze",                             tag:"bronze",       series:"bronze-works",         img:"../Entry Images/SoulCatchers_Clay-Icon.png"},
  {id:5,  cr:"MOD CR 5",  title:"Pictographs",          date:"c. 1979", year:1979, medium:"Ceramic",                                      tag:"ceramic",         series:"early-clay",                 img:"../Entry Images/Pictograph_icon.png"},
  {id:7,  cr:"MOD CR 7",  title:"Celestial Plaza",      date:"1986",    year:1986, medium:"Bronze — permanent public install.", tag:"bronze",      series:"public-installations", img:"../Entry Images/AMNH_installation-icon.png"},
  {id:9,  cr:"MOD CR 9",  title:"Radiant Disk",         date:"1988",    year:1988, medium:"Bronze with patina",                 tag:"bronze",       series:"bronze-works",         img:"../Entry Images/RadiantDiskIceRing.png"},
  {id:6,  cr:"MOD CR 6",  title:"A Walk on the Beach",  date:"1995",    year:1995, medium:"Bronze — permanent public install.", tag:"bronze",      series:"public-installations", img:"../Entry Images/PAMM-Michel-Oka-Doner-08_ICON-223x119.png"},
  {id:10, cr:"MOD CR 10", title:"Blueprint of Eden",    date:"1999",    year:1999, medium:"Cyanotype, natural specimens",       tag:"paper",           series:"works-on-paper",       img:"../Entry Images/BluePrintOfEden-IconV3-1-213x223.png"},
  {id:11, cr:"MOD CR 11", title:"Thorn Man",            date:"c. 2000", year:2000, medium:"Bronze with silver",                 tag:"bronze",       series:"bronze-works",         img:"../Entry Images/Thornmen3_studio-photos_Dirk-Bakker-R_iconV2-177x223.png"},
  {id:8,  cr:"MOD CR 8",  title:"Into the Mysterium",   date:"2003",    year:2003, medium:"Mixed media installation",           tag:"installation", series:"public-installations", img:"../Entry Images/Mysterium-Icon.png"},
  {id:12, cr:"MOD CR 12", title:"Talisman",             date:"2019",    year:2019, medium:"Bronze — permanent public install.", tag:"bronze",      series:"public-installations", img:"../Entry Images/Talisman_Icon-142x223.png"},
  {id:22, cr:"MOD CR 22", title:"Frond Necklace",       date:"Date pending", year:0, medium:"Silver",        tag:"jewelry", series:"jewelry", img:"../Entry Images/FrondNecklace.jpg"},
  {id:23, cr:"MOD CR 23", title:"Totem Necklace",       date:"Date pending", year:0, medium:"Silver",        tag:"jewelry", series:"jewelry", img:"../Entry Images/TotemNecklace.jpg"},
  {id:24, cr:"MOD CR 24", title:"Amulet Necklace",      date:"Date pending", year:0, medium:"Silver",        tag:"jewelry", series:"jewelry", img:"../Entry Images/AmuletNecklace-Icon.png"},
  {id:25, cr:"MOD CR 25", title:"Palm Necklace",        date:"Date pending", year:0, medium:"Gold",          tag:"jewelry", series:"jewelry", img:"../Entry Images/PalmNecklaceGold.jpg"},
  {id:26, cr:"MOD CR 26", title:"Seed Ring",            date:"Date pending", year:0, medium:"Gold",          tag:"jewelry", series:"jewelry", img:"../Entry Images/SeedRing.jpg"},
  {id:27, cr:"MOD CR 27", title:"Ceremonial Silver",    date:"Date pending", year:0, medium:"Silver",        tag:"jewelry", series:"jewelry", img:"../Entry Images/CeremonialSilver-Icon.png"},
  {id:28, cr:"MOD CR 28", title:"Palm Vase",            date:"1999",         year:1999, medium:"Sterling silver", tag:"jewelry", series:"jewelry", img:"../Entry Images/PalmVase1999-Icon.png"},
];

function loadJSON(key){ try{ return JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ return []; } }
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

function pendingDeletionIds(){
  return new Set(loadJSON('modcr_pending_deletions').map(d=>d.id));
}

function render(){
  const q = document.getElementById('searchName').value.toLowerCase();
  const tag = document.getElementById('filterTag').value;
  const decade = document.getElementById('filterDecade').value;
  const marked = pendingDeletionIds();

  const filtered = works.filter(w=>{
    if(q && !(w.title.toLowerCase().includes(q) || w.cr.toLowerCase().includes(q))) return false;
    if(tag && w.tag !== tag) return false;
    if(decade && !(w.year >= parseInt(decade) && w.year < parseInt(decade)+10)) return false;
    return true;
  });

  document.getElementById('resultCount').textContent = `${filtered.length} of ${works.length} works`;

  const tbody = document.getElementById('worksTableBody');
  if(filtered.length === 0){
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">No works match this search.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(w=>{
    const isMarked = marked.has(w.id);
    const actions = isMarked
      ? `<button class="undo-link" onclick="undoDelete(${w.id})">Undo</button>`
      : `<a href="catalogue_intake_v1_sans.html?edit=${w.id}">Edit</a><button class="del-link" onclick="markDelete(${w.id},'${w.title.replace(/'/g,"\\'")}')">Delete</button>`;
    return `<tr class="${isMarked?'pending-delete':''}">
      <td>${w.img?`<img class="row-thumb" src="${w.img}" alt="" onerror="this.style.visibility='hidden'">`:''}</td>
      <td class="row-title">${w.title}</td>
      <td>${w.cr}</td>
      <td>${w.date}</td>
      <td>${w.medium}</td>
      <td><div class="row-actions">${actions}</div></td>
    </tr>`;
  }).join('');
}

function markDelete(id, title){
  if(!confirm(`Mark "${title}" for removal? This queues the removal for export — nothing is deleted from the live site until the export is applied.`)) return;
  const list = loadJSON('modcr_pending_deletions');
  if(!list.find(d=>d.id===id)) list.push({id, title});
  saveJSON('modcr_pending_deletions', list);
  render();
}
function undoDelete(id){
  saveJSON('modcr_pending_deletions', loadJSON('modcr_pending_deletions').filter(d=>d.id!==id));
  render();
}

['searchName','filterTag','filterDecade'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});
render();
</script>
</body>
</html>
