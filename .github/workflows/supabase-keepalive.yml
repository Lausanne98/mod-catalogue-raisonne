name: Supabase keep-alive

# Supabase's free tier auto-pauses a project after 7 days with no database
# activity. This runs a real, lightweight read once a day so the project
# never goes idle long enough to trigger that -- no new account, no cost,
# no plan change. Hits `materials` specifically because it's small and
# publicly readable (RLS: materials_public_read), so the anon key already
# shipped in HTMLs/modcr-client.js is enough -- no secrets needed here.
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://kuyyrygvaotsrhbyjyjw.supabase.co/rest/v1/materials?select=slug&limit=1" \
            -H "apikey: sb_publishable_s1HGNRWL1LbiCXzFDK4igg_41mnArJx")
          echo "Supabase responded: $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase keep-alive ping failed with status $status"
            exit 1
          fi
